[package]
name = "forge"
version = "0.1.0"
description = "FORGE - Matura Training System"
authors = ["odzi678"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
# Tylko SQLite. Blueprint sek. 12 wymaga bazy lokalnej i braku chmury,
# wiec nie wlaczamy sterownikow sieciowych (postgres/mysql).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Klient HTTP dla opcjonalnej warstwy AI (sek. 11). TLS przez rustls z wbudowanymi
# certyfikatami - bez zaleznosci od OpenSSL i bez domyslnych funkcji reqwest.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
