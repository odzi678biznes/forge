# Wersja na telefon: buduje FORGE i publikuje na GitHub Pages.
#
# Działa dopiero po utworzeniu repozytorium na GitHubie i włączeniu
# Settings -> Pages -> Source: "GitHub Actions". Adres będzie w postaci
# https://<użytkownik>.github.io/<repozytorium>/ - stąd FORGE_BASE niżej.
name: Wersja na telefon (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Ta sama wersja co na komputerze deweloperskim.
          node-version: 24
          cache: npm
      - run: npm ci
      # Nie publikujemy wersji, której testy nie przechodzą. Reporter
      # github-actions pokazuje nieudane testy jako adnotacje przy commicie.
      - name: Testy
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=github-actions 2>&1 | tee vitest.log
      # Błąd spoza testów (np. przy starcie) nie daje adnotacji - pokazujemy
      # koniec wyjścia w podsumowaniu przebiegu, bez szukania w logach.
      - name: Powód nieudanych testów
        if: failure()
        run: |
          msg=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -v '^[[:space:]]*$' | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Testy nie przeszły::$msg"
      - run: npm run build
        env:
          FORGE_BASE: /${{ github.event.repository.name }}/
      # Testy E2E na tym samym buildzie, który zostanie opublikowany: lekcja,
      # diagnoza, Python w przeglądarce, układ telefonu, praca offline.
      - name: Przeglądarka do testów E2E
        run: npx playwright install --with-deps chromium
      - name: Testy E2E
        run: npx playwright test
        env:
          FORGE_BASE: /${{ github.event.repository.name }}/
      - name: Ślad nieudanych testów E2E
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-slady
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
