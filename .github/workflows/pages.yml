# Wersja na telefon: buduje FORGE i publikuje na GitHub Pages.
#
# Działa dopiero po utworzeniu repozytorium na GitHubie i włączeniu
# Settings -> Pages -> Source: "GitHub Actions". Adres będzie w postaci
# https://<użytkownik>.github.io/<repozytorium>/ - stąd FORGE_BASE niżej.
name: Wersja na telefon (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Ta sama wersja co na komputerze deweloperskim.
          node-version: 24
          cache: npm
      - run: npm ci
      # Nie publikujemy wersji, której testy nie przechodzą. Reporter
      # github-actions pokazuje nieudane testy jako adnotacje przy commicie.
      - run: npx vitest run --reporter=default --reporter=github-actions
      - run: npm run build
        env:
          FORGE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
